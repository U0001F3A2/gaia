syntax = "proto3";
package gaia.nonce.v1;

option go_package = "github.com/cosmos/gaia/x/nonce/types";

import "gogoproto/gogo.proto";
import "amino/amino.proto";
import "gaia/nonce/v1/nonce.proto";

// GenesisState defines the x/nonce module's genesis state.
message GenesisState {
  // params are the module parameters (time windows, cutoff threshold).
  Params params = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];

  // nonce_entries are all currently active (non-expired) consumed timestamp nonces.
  repeated NonceEntry nonce_entries = 2 [ (gogoproto.nullable) = false ];

  // prune_high_watermark_us is the highest pruning cutoff (microseconds) ever
  // used by PreBlocker. Monotonically increasing. Prevents replay attacks when
  // past_window_us is expanded via governance: nonces below this value are always
  // rejected regardless of the current time window.
  uint64 prune_high_watermark_us = 3;
}
